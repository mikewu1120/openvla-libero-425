<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OpenVLA offline presentation</title><style>body{margin:0;background:#15263b;color:white;font:16px Arial}#stage{position:relative;width:min(100vw,calc((100vh - 60px)*16/9));aspect-ratio:16/9;margin:auto;background:white}#slide{width:100%;height:100%}video{position:absolute;left:12.109375%;top:17.361111%;width:75.78125%;height:75.833333%;background:#111}nav{height:54px;display:flex;gap:14px;align-items:center;justify-content:center}button,a{font:inherit;color:inherit;background:transparent;border:1px solid #8494a8;padding:7px 12px;text-decoration:none}#counter{min-width:130px;text-align:center}</style><div id="stage"><img id="slide" alt="Presentation slide"><video id="demo" controls preload="metadata" src="demos/paired_tradeoff.mp4" hidden></video></div><nav><button id="prev">Previous</button><span id="counter"></span><button id="next">Next</button><button id="full">Fullscreen</button><a href="index.html">Results</a></nav><script>let i=1;const image=document.getElementById('slide'),video=document.getElementById('demo');function show(n){i=Math.max(1,Math.min(13,n));video.pause();video.currentTime=0;image.src='slides/slide-'+String(i).padStart(2,'0')+'.png';video.hidden=i!==7;document.getElementById('counter').textContent=i+' / 13'+(i>10?' · Appendix':'');history.replaceState(null,'','#'+i);}document.getElementById('prev').onclick=()=>show(i-1);document.getElementById('next').onclick=()=>show(i+1);document.getElementById('full').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();document.addEventListener('keydown',e=>{if(['ArrowRight','PageDown'].includes(e.key)){e.preventDefault();show(i+1);}if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();show(i-1);}if(e.code==='Space'){e.preventDefault();if(i===7){video.paused?video.play():video.pause();}else show(i+1);}});show(Number(location.hash.slice(1))||1);</script></html>
